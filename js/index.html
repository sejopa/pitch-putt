<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch &amp; Putt · SEJOPA vs HAL</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f7f2; --card:#fff; --ink:#1d2a1f; --mut:#667366; --line:#dfe6db;
  --acc:#2f7d3b; --acc2:#e8f3e6; --win:#b8860b; --c2:#d9822b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#121a14; --card:#1b261d; --ink:#e8f0e6; --mut:#9aab9a; --line:#2b3a2d;
    --acc:#5fbf6e; --acc2:#233a27; --win:#e0b84a; --c2:#f0a050;
  }
}
:root[data-theme="dark"] {
  --bg:#121a14; --card:#1b261d; --ink:#e8f0e6; --mut:#9aab9a; --line:#2b3a2d;
  --acc:#5fbf6e; --acc2:#233a27; --win:#e0b84a; --c2:#f0a050;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:720px; margin:0 auto; padding:16px; }
h1 { font-size:1.5rem; margin:8px 0 2px; }
.sub { color:var(--mut); margin:0 0 16px; font-size:.9rem; }
.cg { margin-top:12px; }
.ct { font-size:.75rem; color:var(--mut); margin:16px 0 4px; text-transform:uppercase; letter-spacing:.05em; }
.ch { width:100%; height:auto; display:block; }
.lg { display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; margin-bottom:4px; }
.lg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
.lg.sm { font-size:.72rem; color:var(--mut); margin-top:6px; }
.dr { display:flex; align-items:center; gap:8px; margin:4px 0; }
.dr b { width:66px; font-size:.8rem; overflow:hidden; text-overflow:ellipsis; }
.bar { flex:1; display:flex; height:24px; border-radius:6px; overflow:hidden; }
.bar span { display:flex; align-items:center; justify-content:center; color:#fff; font-size:.75rem; font-weight:600; }
table.st { min-width:0; width:100%; }
.st td:first-child { color:var(--mut); }
.sh { font-size:1.15rem; margin:22px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--acc); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:12px; }
.stat { background:var(--acc2); border-radius:12px; padding:10px 12px; }
.stat b { display:block; font-size:1.3rem; }
.stat span { color:var(--mut); font-size:.8rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; }
.row small { color:var(--mut); }
.score { display:flex; gap:14px; margin-top:8px; font-size:1.05rem; }
.score div { flex:1; }
.score .w { color:var(--win); font-weight:700; }
.scroll { overflow-x:auto; margin-top:10px; }
table { border-collapse:collapse; width:100%; min-width:480px; font-size:.9rem; text-align:center; }
th, td { padding:6px 4px; border-bottom:1px solid var(--line); }
th { color:var(--mut); font-weight:500; }
td:first-child, th:first-child { text-align:left; }
.msg { color:var(--mut); text-align:center; padding:24px 8px; }
.hide { display:none !important; }

.retro-container { margin-top:16px; animation:fadeIn .3s ease-in-out; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
.retro-wrapper {
  font-family:'Press Start 2P', monospace;
  background:#0f172a; color:#fff;
  border-radius:12px; overflow:hidden; border:2px solid #3b82f6;
}
.retro-header { background:#1e1b4b; border-bottom:4px solid #eab308; padding:10px; text-align:center; }
.retro-header h1 { font-size:10px; color:#facc15; margin:0; letter-spacing:1px; line-height:1.4; }
.retro-screen { position:relative; background:#000; width:100%; aspect-ratio:4/3; }
.retro-screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.retro-badge {
  position:absolute; top:8px; left:8px;
  background:rgba(30,27,75,0.85); border:1px solid #eab308;
  padding:5px 9px; font-size:8px; color:#facc15; border-radius:4px; z-index:50;
}

.retro-score {
  background:#151238; border-bottom:2px solid #312e81;
  padding:6px 10px;
  display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px;
  font-size:8px; color:#facc15; text-align:center; line-height:1.6;
}
.retro-commentary {
  background:#0b1020; border-top:2px solid #312e81;
  padding:9px 12px; min-height:34px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:9px; color:#facc15; line-height:1.5;
}
.retro-controls {
  background:#1e1b4b; border-top:2px solid #312e81; padding:12px;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
}
.retro-controls button {
  font-family:inherit; font-size:9px; padding:10px 16px; border:none; border-radius:4px;
  cursor:pointer; color:#fff; border-bottom:3px solid rgba(0,0,0,0.3); transition:transform .1s;
}
.retro-controls button:active { transform:translateY(2px); border-bottom-width:1px; }
.retro-btn-play { background:#059669; }
.retro-btn-pause { background:#d97706; }
.retro-btn-reset { background:#dc2626; }
.retro-btn-nav { background:#3730a3; }
.retro-hole-label { font-size:9px; color:#facc15; margin:0 12px; }
.retro-btn {
  background:#3730a3; color:#fff; border:2px solid #4f46e5;
  font-family:'Press Start 2P', monospace; font-size:10px;
  padding:12px; width:100%; margin-top:8px; cursor:pointer; border-radius:8px;
}
.retro-btn:hover { background:#4f46e5; }
/* ---------- PANTALLA COMPLETA DEL VÍDEO ---------- */
.retro-wrapper:fullscreen,
.retro-wrapper:-webkit-full-screen {
  display:flex; flex-direction:column;
  width:100vw; height:100vh; max-height:none;
  border:none; border-radius:0;
}
.retro-wrapper:fullscreen .retro-screen,
.retro-wrapper:-webkit-full-screen .retro-screen {
  flex:1 1 auto; min-height:0;
  width:100%; height:auto; aspect-ratio:auto; max-height:none;
}

/* ---------- BARRA DE TIEMPO TIPO VÍDEO ---------- */
.retro-timeline {
  background:#151238; border-top:2px solid #312e81;
  padding:8px 12px;
  display:flex; align-items:center; gap:8px;
}
.retro-timeline input[type=range] {
  flex:1; height:22px; margin:0;
  accent-color:#eab308;
  background:transparent;
  cursor:pointer;
}
.tl-time {
  font-size:9px; color:#facc15; min-width:40px; text-align:center;
  background:rgba(30,27,75,0.85); border:1px solid #eab308; border-radius:4px; padding:3px 4px;
}

.hole-result-screen {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background:rgba(15,23,42,0.95);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:100; padding:20px; overflow-y:auto;
}
.hole-result-screen h2 { font-size:18px; color:#ffd700; margin-bottom:15px; text-align:center; }
.hole-result-screen .pot { font-size:60px; margin:10px 0; }
.hole-result-screen .winner { font-size:14px; color:#4ade80; margin:10px 0; }
.hole-result-screen .coins { font-size:20px; color:#ffd700; margin:15px 0; }
.hole-result-screen .scores { margin-top:15px; font-size:11px; color:#a8d8ea; line-height:1.8; text-align:center; }
.hole-result-screen button {
  margin-top:20px; padding:12px 24px; font-family:inherit; font-size:11px;
  background:#059669; color:#fff; border:none; border-radius:8px; cursor:pointer;
  border-bottom:4px solid #047857;
}
.hole-result-screen button:active { transform:translateY(2px); border-bottom-width:2px; }
</style>
</head>
<body>
<main>
<h1>⛳ Pitch &amp; Putt</h1>
<p class="sub">Pitch &amp; Putt de Badalona · 9 hoyos · Par 3</p>
<section id="v1"><div id="list"><div class="msg">Cargando…</div></div></section>
</main>

<script src="https://unpkg.com/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="partidas.js"></script>
<script src="js/tuning.js"></script>
<script src="js/avatars.js"></script>
<script src="js/course.js"></script>
<script src="js/engine3D.js"></script>
<script src="js/main.js"></script>
</body>
</html>
