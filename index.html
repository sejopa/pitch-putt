<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch &amp; Putt · SEJOPA vs HAL</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#1d2a1f;--mut:#667366;--line:#dfe6db;--acc:#2f7d3b;--acc2:#e8f3e6;--win:#b8860b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261d;--ink:#e8f0e6;--mut:#9aab9a;--line:#2b3a2d;--acc:#5fbf6e;--acc2:#233a27;--win:#e0b84a}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1b261d;--ink:#e8f0e6;--mut:#9aab9a;--line:#2b3a2d;--acc:#5fbf6e;--acc2:#233a27;--win:#e0b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root{--c2:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c2:#f0a050}}
:root[data-theme="dark"]{--c2:#f0a050}
.cg{margin-top:12px}
.ct{font-size:.75rem;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.ch{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-bottom:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lg.sm{font-size:.72rem;color:var(--mut);margin-top:6px}
.dr{display:flex;align-items:center;gap:8px;margin:4px 0}
.dr b{width:66px;font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;display:flex;height:24px;border-radius:6px;overflow:hidden}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600}
table.st{min-width:0;width:100%}
.st td:first-child{color:var(--mut)}
.sh{font-size:1.15rem;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--acc2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.stat span{color:var(--mut);font-size:.8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.row small{color:var(--mut)}
.score{display:flex;gap:14px;margin-top:8px;font-size:1.05rem}
.score div{flex:1}
.score .w{color:var(--win);font-weight:700}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem;text-align:center}
th,td{padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
td input{width:54px;text-align:center;padding:6px 2px}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer;width:100%;margin-top:12px}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;margin-top:10px;padding:0;text-decoration:underline}
.msg{color:var(--mut);text-align:center;padding:24px 8px}
.hide{display:none!important}

.retro-container { margin-top: 16px; animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.retro-wrapper { font-family: 'Press Start 2P', monospace; image-rendering: pixelated; background: #0f172a; color: #fff; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; }
.retro-header { background: #1e1b4b; border-bottom: 4px solid #eab308; padding: 10px; text-align: center; }
.retro-header h1 { font-size: 10px; color: #facc15; margin: 0; letter-spacing: 1px; line-height: 1.4; }
.retro-screen { position: relative; background: #000; width: 100%; aspect-ratio: 4/3; max-height: 420px; }
.retro-screen canvas { width: 100%; height: 100%; image-rendering: pixelated; background: #7dd3fc; }
.retro-badge { position: absolute; top: 8px; left: 8px; background: rgba(30, 27, 75, 0.9); border: 1px solid #eab308; padding: 6px 10px; font-size: 9px; color: #facc15; border-radius: 4px; }
.retro-subtitle { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #eab308; padding: 10px 16px; font-size: 10px; color: #facc15; text-align: center; line-height: 1.5; border-radius: 4px; max-width: 90%; white-space: pre-line; min-width: 250px; }
.retro-controls { background: #1e1b4b; border-top: 2px solid #312e81; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.retro-controls button { font-family: inherit; font-size: 9px; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; color: #fff; border-bottom: 3px solid rgba(0,0,0,0.3); transition: transform 0.1s; }
.retro-controls button:active { transform: translateY(2px); border-bottom-width: 1px; }
.retro-btn-play { background: #059669; }
.retro-btn-pause { background: #d97706; }
.retro-btn-reset { background: #dc2626; }
.retro-btn-nav { background: #3730a3; }
.retro-hole-label { font-size: 9px; color: #facc15; margin: 0 12px; }
.retro-btn { background: #3730a3; color: #fff; border: 2px solid #4f46e5; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px; width: 100%; margin-top: 8px; cursor: pointer; border-radius: 8px; }
.retro-btn:hover { background: #4f46e5; }

.hole-result-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
}
.hole-result-screen h2 { font-size: 18px; color: #ffd700; margin-bottom: 15px; text-align: center; }
.hole-result-screen .pot { font-size: 60px; margin: 10px 0; }
.hole-result-screen .winner { font-size: 14px; color: #4ade80; margin: 10px 0; }
.hole-result-screen .coins { font-size: 20px; color: #ffd700; margin: 15px 0; }
.hole-result-screen .scores { margin-top:15px; font-size:11px; color:#a8d8ea; line-height:1.8; }
.hole-result-screen button {
  margin-top: 20px; padding: 12px 24px; font-family: inherit; font-size: 11px;
  background: #059669; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  border-bottom: 4px solid #047857;
}
.hole-result-screen button:active { transform: translateY(2px); border-bottom-width: 2px; }
</style>
</head>
<body>
<main>
<h1>⛳ Pitch &amp; Putt</h1>
<p class="sub">Pitch &amp; Putt de Badalona · 9 hoyos</p>
<section id="v1"><div id="list"><div class="msg">Cargando…</div></div></section>
</main>
<script src="partidas.js"></script>
<script>
(function(){
var HOLES=9, PAR=27, games=[], coll=true;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(a){return a.reduce(function(x,y){return x+(+y||0)},0)}
function fmtDate(d){try{return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function diff(t){var d=t-PAR;return d>0?"+"+d:String(d)}

function statsFor(gs){
  var wins={},tot={},cnt={},best=null;
  gs.forEach(function(g){
    var p=g.players||[];if(p.length<2)return;
    var t=p.map(function(x){return sum(x.scores)});
    p.forEach(function(x,i){var k=x.name;tot[k]=(tot[k]||0)+t[i];cnt[k]=(cnt[k]||0)+1;
      if(!best||t[i]<best.t)best={t:t[i],n:k}});
    if(t[0]!==t[1]){var w=t[0]<t[1]?p[0].name:p[1].name;wins[w]=(wins[w]||0)+1}
  });
  var s='<div class="stat"><b>'+gs.length+'</b><span>partidas jugadas</span></div>';
  Object.keys(cnt).forEach(function(k){
    s+='<div class="stat"><b>'+(wins[k]||0)+' 🏆</b><span>'+esc(k)+' · media '+(tot[k]/cnt[k]).toFixed(1)+'</span></div>'});
  if(best)s+='<div class="stat"><b>'+best.t+'</b><span>mejor ronda ('+esc(best.n)+')</span></div>';
  return s;
}

function charts(g){
  var p=g.players||[];if(p.length<2)return "";
  var n=HOLES,sc=[p[0].scores,p[1].scores],nm=[p[0].name,p[1].name],a=sc[0],b=sc[1];
  var col=["var(--acc)","var(--c2)"],i,k,v;
  var lg='<div class="lg">'+[0,1].map(function(q){return '<span><i style="background:'+col[q]+'"></i>'+esc(nm[q])+'</span>'}).join("")+'</div>';
  var W=340,L=24,R=8,T=14,B=22,iw=W-L-R;
  var H1=170,ih=H1-T-B,mx=Math.max(5,Math.max.apply(null,a.concat(b)));
  var Y=function(x){return T+ih-x/mx*ih};
  var s1='<svg viewBox="0 0 '+W+' '+H1+'" class="ch" role="img" aria-label="Golpes por hoyo">';
  for(v=0;v<=mx;v++){s1+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end" style="fill:var(--mut);font-size:9px">'+v+'</text>'}
  var gw=iw/n,bw=gw*0.36;
  for(i=0;i<n;i++){
    var cx=L+gw*i+gw/2;
    for(k=0;k<2;k++){
      var val=sc[k][i],x=k?cx+1:cx-bw-1;
      s1+='<rect x="'+x+'" y="'+Y(val)+'" width="'+bw+'" height="'+(Y(0)-Y(val))+'" rx="2" style="fill:'+col[k]+'"/><text x="'+(x+bw/2)+'" y="'+(Y(val)-3)+'" text-anchor="middle" style="fill:var(--ink);font-size:8px">'+val+'</text>';
    }
    s1+='<text x="'+cx+'" y="'+(H1-7)+'" text-anchor="middle" style="fill:var(--mut);font-size:9px">'+(i+1)+'</text>';
  }
  s1+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(3)+'" y2="'+Y(3)+'" style="stroke:var(--win);stroke-dasharray:4 3;stroke-width:1.3"/><text x="'+(W-R)+'" y="'+(Y(3)-3)+'" text-anchor="end" style="fill:var(--win);font-size:8px">par 3</text></svg>';
  var cum=sc.map(function(r){var c=0;return r.map(function(x){c+=x-3;return c})});
  var all=cum[0].concat(cum[1],[0]),lo=Math.min.apply(null,all)-1,hi=Math.max.apply(null,all)+1;
  var H2=160,ih2=H2-T-B;
  var Y2=function(x){return T+ih2-(x-lo)/(hi-lo)*ih2};
  var X2=function(j){return L+iw*(j+0.5)/n};
  var fmt=function(x){return x>0?"+"+x:String(x)};
  var s2='<svg viewBox="0 0 '+W+' '+H2+'" class="ch" role="img" aria-label="Evolución respecto al par">';
  var step=Math.max(1,Math.ceil((hi-lo)/6));
  for(v=Math.ceil(lo);v<=hi;v+=step){s2+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(v)+'" y2="'+Y2(v)+'" style="stroke:var(--line)"/><text x="'+(L-5)+'" y="'+(Y2(v)+3)+'" text-anchor="end" style="fill:var(--mut);font-size:9px">'+fmt(v)+'</text>'}
  s2+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(0)+'" y2="'+Y2(0)+'" style="stroke:var(--win);stroke-dasharray:4 3;stroke-width:1.3"/><text x="'+(W-R)+'" y="'+(Y2(0)-3)+'" text-anchor="end" style="fill:var(--win);font-size:8px">par</text>';
  for(k=0;k<2;k++){
    s2+='<polyline fill="none" style="stroke:'+col[k]+';stroke-width:2.2;stroke-linejoin:round" points="'+cum[k].map(function(c,j){return X2(j)+","+Y2(c)}).join(" ")+'"/>';
    cum[k].forEach(function(c,j){s2+='<circle cx="'+X2(j)+'" cy="'+Y2(c)+'" r="2.6" style="fill:'+col[k]+'"/>'});
    var last=cum[k][n-1];
    s2+='<text x="'+(X2(n-1)+5)+'" y="'+(Y2(last)+(k?11:-5))+'" text-anchor="end" style="fill:'+col[k]+';font-size:9px;font-weight:700">'+fmt(last)+'</text>';
  }
  for(i=0;i<n;i++)s2+='<text x="'+X2(i)+'" y="'+(H2-7)+'" text-anchor="middle" style="fill:var(--mut);font-size:9px">'+(i+1)+'</text>';
  s2+='</svg>';
  var cats=[["Birdie o mejor",function(x){return x<=2},"#2f9e5a"],["Par",function(x){return x===3},"#4c8bd6"],["Bogey",function(x){return x===4},"#e0a030"],["Doble o más",function(x){return x>=5},"#d9534f"]];
  var dist=[0,1].map(function(q){
    var segs=cats.map(function(c){var cnt=sc[q].filter(c[1]).length;return cnt?'<span style="flex:'+cnt+';background:'+c[2]+'" title="'+c[0]+'">'+cnt+'</span>':""}).join("");
    return '<div class="dr"><b>'+esc(nm[q])+'</b><div class="bar">'+segs+'</div></div>';
  }).join("");
  var dleg='<div class="lg sm">'+cats.map(function(c){return '<span><i style="background:'+c[2]+'"></i>'+c[0]+'</span>'}).join("")+'</div>';
  var w=[0,0,0];
  for(i=0;i<n;i++){if(a[i]<b[i])w[0]++;else if(a[i]>b[i])w[1]++;else w[2]++}
  var tt=[sum(a),sum(b)];
  var mn=function(r){var m=Math.min.apply(null,r);return m+" · hoyo "+(r.indexOf(m)+1)};
  var mxx=function(r){var m=Math.max.apply(null,r);return m+" · hoyo "+(r.indexOf(m)+1)};
  var rows=[["Total",tt[0],tt[1]],["Respecto al par",diff(tt[0]),diff(tt[1])],["Media por hoyo",(tt[0]/n).toFixed(2),(tt[1]/n).toFixed(2)],["Hoyos ganados",w[0],w[1]],["Mejor hoyo",mn(a),mn(b)],["Peor hoyo",mxx(a),mxx(b)]];
  var tbl='<table class="st"><tr><th></th><th>'+esc(nm[0])+'</th><th>'+esc(nm[1])+'</th></tr>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join("")+'</table><div class="lg sm" style="margin-top:6px">Hoyos empatados: '+w[2]+'</div>';
  return '<div class="cg">'+lg+'<div class="ct">Golpes por hoyo</div>'+s1+'<div class="ct">Evolución respecto al par</div>'+s2+'<div class="ct">Tipo de resultado</div>'+dist+dleg+'<div class="ct">Estadísticas de la partida</div>'+tbl+'</div>';
}

function gameCard(g){
  var p=g.players||[];var t=p.map(function(x){return sum(x.scores)});
  var win=t[0]===t[1]?-1:(t[0]<t[1]?0:1);
  var sc=p.map(function(x,i){return '<div class="'+(win===i?"w":"")+'">'+esc(x.name)+(win===i?" 🏆":"")+'<br><b>'+t[i]+'</b> <small>('+diff(t[i])+')</small></div>'}).join("");
  var h="";for(var i=1;i<=HOLES;i++)h+="<th>"+i+"</th>";
  var rows=p.map(function(x){return "<tr><td>"+esc(x.name)+"</td>"+x.scores.map(function(v){return "<td>"+esc(v)+"</td>"}).join("")+"<td><b>"+sum(x.scores)+"</b></td></tr>"}).join("");
  var matchJson = JSON.stringify(g).replace(/'/g, "&#39;");
  return '<div class="card" data-id="'+esc(g.id)+'" data-match=\''+matchJson+'\'>'
    +'<div class="row"><b>Partida '+esc(g.num||"–")+'</b><small>'+fmtDate(g.date)+'</small></div>'
    +'<small style="color:var(--mut)">'+esc(g.course||"Sin campo")+'</small>'
    +'<div class="score">'+sc+'</div>'
    +'<div class="det hide">'
      +'<button class="retro-btn" onclick="event.stopPropagation(); window.toggleRetro(this, \''+esc(g.id)+'\')">🎮 Ver Replay 16-bits</button>'
      +'<div id="retro-'+esc(g.id)+'" class="retro-container hide"></div>'
      +charts(g)
      +'<div class="ct">Detalle por hoyo</div><div class="scroll" style="margin-top:0"><table><tr><th>Hoyo</th>'+h+'<th>Total</th></tr>'+rows+'</table></div>'
    +'</div></div>';
}

function render(){
  var list=$("list");
  if(!coll){list.innerHTML='<div class="msg">No se puede acceder a la base de datos compartida.</div>';return}
  if(!games.length){list.innerHTML='<div class="msg">Todavía no hay partidas.</div>';return}
  var by={};
  games.forEach(function(g){var k=g.season||"";(by[k]=by[k]||[]).push(g)});
  var ks=Object.keys(by).sort().reverse();
  list.innerHTML=ks.map(function(k){
    return '<h2 class="sh">'+(k?"Temporada "+esc(k):"Sin temporada")+'</h2><div class="stats">'+statsFor(by[k])+'</div>'+by[k].map(gameCard).join("");
  }).join("");
}

window.toggleRetro = function(btn, gameId) {
  var card = btn.closest(".card");
  var container = document.getElementById("retro-" + gameId);
  var matchData = JSON.parse(card.getAttribute("data-match").replace(/&#39;/g, "'"));
  if (!container.classList.contains("hide")) {
    container.classList.add("hide");
    if (container._cleanup) container._cleanup();
  } else {
    container.classList.remove("hide");
    if (!container._initialized) {
      window.initRetroReplay(container, matchData);
      container._initialized = true;
    } else if (container._resume) {
      container._resume();
    }
  }
};

$("list").addEventListener("click",function(e){
  var card=e.target.closest(".card");if(!card)return;
  if(e.target.classList.contains("retro-btn")) return;
  var d=card.querySelector(".det");
  if(d && !e.target.closest(".det")) {
    var willHide = !d.classList.contains("hide");
    d.classList.toggle("hide");
    if (willHide) {
      var rc = d.querySelector(".retro-container");
      if (rc && rc._cleanup) rc._cleanup();
    } else {
      var rc = d.querySelector(".retro-container");
      if (rc && rc._resume) rc._resume();
    }
  }
});

games=(window.PARTIDAS||[]).map(function(g,i){var o=Object.assign({},g);o.id="p"+i;return o})
  .sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||((b.num||0)-(a.num||0))});
render();
})();

// --- MOTOR DE REPLAY RETRO 16-BITS ---
window.initRetroReplay = function(container, matchData) {
  var retroHTML = '<div class="retro-wrapper"><header class="retro-header"><h1>⛳ BADALONA GOLF TOUR</h1></header><div class="retro-screen"><canvas id="retroCanvas" width="640" height="480"></canvas><div id="retroBadge" class="retro-badge">TURNO: --</div><div id="retroSubtitle" class="retro-subtitle">¡Pulsa REPRODUCIR!</div><div id="holeResultScreen" class="hole-result-screen hide"></div></div><div class="retro-controls"><button id="retroPlayBtn" class="retro-btn-play">▶ REPRODUCIR</button><button id="retroPauseBtn" class="retro-btn-pause hide">⏸ PAUSA</button><button id="retroResetBtn" class="retro-btn-reset">🔄 REINICIAR</button><button id="retroPrevBtn" class="retro-btn-nav">◀ HOYO</button><span id="retroHoleLabel" class="retro-hole-label">HOYO 1/9</span><button id="retroNextBtn" class="retro-btn-nav">HOYO ▶</button></div></div>';
  container.innerHTML = retroHTML;
  
  var players = matchData.players.map(function(p, i) {
    return { name: p.name, color: i === 0 ? "#ef4444" : "#3b82f6", scores: p.scores };
  });
  
  var courseData = {
    name: matchData.course || "Pitch & Putt de Badalona",
    holes: [
      { hoyo: 1, par: 3, dist: "140m", desc: "Hoyo corto con green protegido." },
      { hoyo: 2, par: 3, dist: "130m", desc: "Hoyo técnico con árboles a los lados." },
      { hoyo: 3, par: 3, dist: "150m", desc: "Hoyo con obstáculo de agua lateral." },
      { hoyo: 4, par: 3, dist: "145m", desc: "Calle estrecha con rough pronunciado." },
      { hoyo: 5, par: 3, dist: "135m", desc: "Oportunidad de birdie con green accesible." },
      { hoyo: 6, par: 3, dist: "125m", desc: "Par 3 técnico con búnker de arena." },
      { hoyo: 7, par: 3, dist: "155m", desc: "El hoyo más largo. Cuidado con el viento." },

  function buildHoleSequence() {
    state.matchSequence = [];
    var holeInfo = courseData.holes[state.currentHoleIndex];
    var p0 = courseData.players[0];
    var p1 = courseData.players[1];
    var score0 = p0.scores[state.currentHoleIndex];
    var score1 = p1.scores[state.currentHoleIndex];
    var maxScore = Math.max(score0, score1);

    var seq0 = getShotSequence(score0);
    var seq1 = getShotSequence(score1);

    var shotCount0 = 0;
    var shotCount1 = 0;

    var firstPlayerIdx = state.nextStarterIndex;
    var secondPlayerIdx = (state.nextStarterIndex + 1) % 2;
    var playersInOrder = [courseData.players[firstPlayerIdx], courseData.players[secondPlayerIdx]];

    for (var s = 1; s <= maxScore; s++) {
      for (var i = 0; i < 2; i++) {
        var p = playersInOrder[i];
        var origIdx = (i === 0) ? firstPlayerIdx : secondPlayerIdx;
        var totalScore = (origIdx === 0) ? score0 : score1;

        if (s <= totalScore) {
          var currentShotForPlayer = (origIdx === 0) ? shotCount0 : shotCount1;
          var shotType = (origIdx === 0) ? seq0[currentShotForPlayer] : seq1[currentShotForPlayer];
          var isFinalShot = (s === totalScore);
          var isLastPutt = (shotType === 'putt' && isFinalShot);
          
          var cam = (shotType === 'putt') ? 'FIRST_PERSON' : 'SIDE';
          var dialogue = "";

          if (shotType === 'putt') {
            if (isLastPutt) {
              var diff = totalScore - holeInfo.par;
              if (diff < 0) dialogue = p.name + ": " + getRandomDialogue('birdie');
              else if (diff === 0) dialogue = p.name + ": " + getRandomDialogue('par');
              else if (diff === 1) dialogue = p.name + ": " + getRandomDialogue('bogey');
              else dialogue = p.name + ": " + getRandomDialogue('doubleBogey');
            } else {
              dialogue = p.name + ": Putt fallado, sigue en el green...";
            }
          } else if (shotType === 'tee') {
            dialogue = p.name + ": Salida desde el tee.";
            if (totalScore >= 5 && Math.random() > 0.7) {
               shotType = 'water';
               dialogue = p.name + ": ¡Salida directa al agua!";
            }
          } else {
            dialogue = p.name + ": Tiro de aproximación.";
            if (totalScore >= 4 && currentShotForPlayer === totalScore - 2 && Math.random() > 0.6) {

               dialogue = p.name + ": El tiro cae en el búnker...";
            }
          }

            player: p,
            stroke: s,
            strokeNum: s,
            totalStrokes: totalScore,
            camera: cam,
            type: shotType,
            subtitle: dialogue,
            playerIndex: origIdx,
            isLastPutt: isLastPutt

          if (origIdx === 0) shotCount0++;

        }
      }
    }

    updateHoleUI();

    if (state.isPlaying && state.currentTask) {
      if (state.phase === 'ANIMATING') {
        state.taskProgress += 0.012;

        }
        if (state.taskProgress >= 1) {
          if (state.currentTask.type === 'water') playSynthSound('splash');

          else if (state.currentTask.type === 'putt') playSynthSound('cheer');
          else playSynthSound('hit');
          state.phase = 'WAITING';
          state.waitProgress = 0;
        }
      } else if (state.phase === 'WAITING') {
        state.waitProgress += 0.008;
        if (state.waitProgress >= 1) {
          state.currentTaskIndex++;
          if (state.currentTaskIndex < state.matchSequence.length) {
            state.currentTask = state.matchSequence[state.currentTaskIndex];
            state.cameraMode = state.currentTask.camera;
            state.taskProgress = 0;
            state.phase = 'ANIMATING';
            setSubtitle(state.currentTask.subtitle);
            updateBadge();
          } else {
            pauseAnimation();
            showHoleResult();

        ballY = holeY;
      }
      
      if (target.miss === true && t > 0.3 && t < 0.8) {
        var curveAmount = Math.sin((t - 0.3) / 0.5 * Math.PI) * 15;
        ballX += curveAmount * (target.x > 320 ? 1 : -1);
      }
    }

    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(ballX, ballY + 4, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ballX, ballY, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#cbd5e1'; ctx.fillRect(ballX - 3, ballY - 2, 2, 2); ctx.fillRect(ballX + 2, ballY + 1, 2, 2);
    var putterOffsetX = 0; if (state.isPlaying && state.phase === 'ANIMATING' && state.taskProgress < 0.12) putterOffsetX = -12;
    var putterX = 320 + putterOffsetX, putterY = 345;
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(320, 480); ctx.lineTo(putterX, putterY); ctx.stroke();
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(putterX - 22, putterY - 6, 44, 12); ctx.fillStyle = '#64748b'; ctx.fillRect(putterX - 22, putterY + 3, 44, 3);
  }

  function drawCloud(cx, cy) { ctx.fillStyle = '#ffffff'; ctx.fillRect(cx, cy, 50, 16); ctx.fillRect(cx + 10, cy - 8, 30, 24); }

  playBtn.addEventListener('click', togglePlay);
  pauseBtn.addEventListener('click', togglePlay);
  container.querySelector('#retroResetBtn').addEventListener('click', resetMatch);
  container.querySelector('#retroNextBtn').addEventListener('click', nextHole);
  container.querySelector('#retroPrevBtn').addEventListener('click', prevHole);

  buildHoleSequence();
  state.animFrameId = requestAnimationFrame(renderLoop);
  
  container._cleanup = function() { if (state.animFrameId) cancelAnimationFrame(state.animFrameId); state.isPlaying = false; playBtn.classList.remove('hide'); pauseBtn.classList.add('hide'); };
  container._resume = function() { if (!state.animFrameId) state.animFrameId = requestAnimationFrame(renderLoop); };
};
</script>
</body>
