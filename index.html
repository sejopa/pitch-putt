<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch &amp; Putt · SEJOPA vs HAL</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#1d2a1f;--mut:#667366;--line:#dfe6db;--acc:#2f7d3b;--acc2:#e8f3e6;--win:#b8860b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261d;--ink:#e8f0e6;--mut:#9aab9a;--line:#2b3a2d;--acc:#5fbf6e;--acc2:#233a27;--win:#e0b84a}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1b261d;--ink:#e8f0e6;--mut:#9aab9a;--line:#2b3a2d;--acc:#5fbf6e;--acc2:#233a27;--win:#e0b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

:root{--c2:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c2:#f0a050}}
:root[data-theme="dark"]{--c2:#f0a050}
.cg{margin-top:12px}
.ct{font-size:.75rem;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.ch{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-bottom:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lg.sm{font-size:.72rem;color:var(--mut);margin-top:6px}
.dr{display:flex;align-items:center;gap:8px;margin:4px 0}
.dr b{width:66px;font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;display:flex;height:24px;border-radius:6px;overflow:hidden}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600}
table.st{min-width:0;width:100%}
.st td:first-child{color:var(--mut)}
.sh{font-size:1.15rem;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--acc2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.stat span{color:var(--mut);font-size:.8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.row small{color:var(--mut)}
.score{display:flex;gap:14px;margin-top:8px;font-size:1.05rem}
.score div{flex:1}
.score .w{color:var(--win);font-weight:700}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem;text-align:center}
th,td{padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
td input{width:54px;text-align:center;padding:6px 2px}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer;width:100%;margin-top:12px}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;margin-top:10px;padding:0;text-decoration:underline}
.msg{color:var(--mut);text-align:center;padding:24px 8px}
.hide{display:none}
</style>
<body>
<main>
<h1>⛳ Pitch &amp; Putt</h1>
<p class="sub">Pitch &amp; Putt de Badalona · 9 hoyos</p>
<section id="v1"><div id="list"><div class="msg">Cargando…</div></div></section>
</main>
<script src="partidas.js"></script>
<script>
(function(){
var HOLES=9, PAR=27, games=[], coll=true;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(a){return a.reduce(function(x,y){return x+(+y||0)},0)}
function fmtDate(d){try{return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function diff(t){var d=t-PAR;return d>0?"+"+d:String(d)}
function statsFor(gs){
  var wins={},tot={},cnt={},best=null;
  gs.forEach(function(g){
    var p=g.players||[];if(p.length<2)return;
    var t=p.map(function(x){return sum(x.scores)});
    p.forEach(function(x,i){var k=x.name;tot[k]=(tot[k]||0)+t[i];cnt[k]=(cnt[k]||0)+1;
      if(!best||t[i]<best.t)best={t:t[i],n:k}});
    if(t[0]!==t[1]){var w=t[0]<t[1]?p[0].name:p[1].name;wins[w]=(wins[w]||0)+1}
  });
  var s='<div class="stat"><b>'+gs.length+'</b><span>partidas jugadas</span></div>';
  Object.keys(cnt).forEach(function(k){
    s+='<div class="stat"><b>'+(wins[k]||0)+' 🏆</b><span>'+esc(k)+' · media '+(tot[k]/cnt[k]).toFixed(1)+'</span></div>'});
  if(best)s+='<div class="stat"><b>'+best.t+'</b><span>mejor ronda ('+esc(best.n)+')</span></div>';
  return s;
}
function charts(g){
  var p=g.players||[];if(p.length<2)return "";
  var n=HOLES,sc=[p[0].scores,p[1].scores],nm=[p[0].name,p[1].name],a=sc[0],b=sc[1];
  var col=["var(--acc)","var(--c2)"],i,k,v;
  var lg='<div class="lg">'+[0,1].map(function(q){return '<span><i style="background:'+col[q]+'"></i>'+esc(nm[q])+'</span>'}).join("")+'</div>';
  var W=340,L=24,R=8,T=14,B=22,iw=W-L-R;

  /* 1 · golpes por hoyo */
  var H1=170,ih=H1-T-B,mx=Math.max(5,Math.max.apply(null,a.concat(b)));
  var Y=function(x){return T+ih-x/mx*ih};
  var s1='<svg viewBox="0 0 '+W+' '+H1+'" class="ch" role="img" aria-label="Golpes por hoyo">';
  for(v=0;v<=mx;v++){s1+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end" style="fill:var(--mut);font-size:9px">'+v+'</text>'}
  var gw=iw/n,bw=gw*0.36;
  for(i=0;i<n;i++){
    var cx=L+gw*i+gw/2;
    for(k=0;k<2;k++){
      var val=sc[k][i],x=k?cx+1:cx-bw-1;
      s1+='<rect x="'+x+'" y="'+Y(val)+'" width="'+bw+'" height="'+(Y(0)-Y(val))+'" rx="2" style="fill:'+col[k]+'"/><text x="'+(x+bw/2)+'" y="'+(Y(val)-3)+'" text-anchor="middle" style="fill:var(--ink);font-size:8px">'+val+'</text>';
    }
    s1+='<text x="'+cx+'" y="'+(H1-7)+'" text-anchor="middle" style="fill:var(--mut);font-size:9px">'+(i+1)+'</text>';
  }
  s1+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(3)+'" y2="'+Y(3)+'" style="stroke:var(--win);stroke-dasharray:4 3;stroke-width:1.3"/><text x="'+(W-R)+'" y="'+(Y(3)-3)+'" text-anchor="end" style="fill:var(--win);font-size:8px">par 3</text></svg>';

  /* 2 · evolución respecto al par */
  var cum=sc.map(function(r){var c=0;return r.map(function(x){c+=x-3;return c})});
  var all=cum[0].concat(cum[1],[0]),lo=Math.min.apply(null,all)-1,hi=Math.max.apply(null,all)+1;
  var H2=160,ih2=H2-T-B;
  var Y2=function(x){return T+ih2-(x-lo)/(hi-lo)*ih2};
  var X2=function(j){return L+iw*(j+0.5)/n};
  var fmt=function(x){return x>0?"+"+x:String(x)};
  var s2='<svg viewBox="0 0 '+W+' '+H2+'" class="ch" role="img" aria-label="Evolución respecto al par">';
  var step=Math.max(1,Math.ceil((hi-lo)/6));
  for(v=Math.ceil(lo);v<=hi;v+=step){s2+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(v)+'" y2="'+Y2(v)+'" style="stroke:var(--line)"/><text x="'+(L-5)+'" y="'+(Y2(v)+3)+'" text-anchor="end" style="fill:var(--mut);font-size:9px">'+fmt(v)+'</text>'}
  s2+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(0)+'" y2="'+Y2(0)+'" style="stroke:var(--win);stroke-dasharray:4 3;stroke-width:1.3"/><text x="'+(W-R)+'" y="'+(Y2(0)-3)+'" text-anchor="end" style="fill:var(--win);font-size:8px">par</text>';
  for(k=0;k<2;k++){
    s2+='<polyline fill="none" style="stroke:'+col[k]+';stroke-width:2.2;stroke-linejoin:round" points="'+cum[k].map(function(c,j){return X2(j)+","+Y2(c)}).join(" ")+'"/>';
    cum[k].forEach(function(c,j){s2+='<circle cx="'+X2(j)+'" cy="'+Y2(c)+'" r="2.6" style="fill:'+col[k]+'"/>'});
    var last=cum[k][n-1];
    s2+='<text x="'+(X2(n-1)+5)+'" y="'+(Y2(last)+(k?11:-5))+'" text-anchor="end" style="fill:'+col[k]+';font-size:9px;font-weight:700">'+fmt(last)+'</text>';
  }
  for(i=0;i<n;i++)s2+='<text x="'+X2(i)+'" y="'+(H2-7)+'" text-anchor="middle" style="fill:var(--mut);font-size:9px">'+(i+1)+'</text>';
  s2+='</svg>';

  /* 3 · tipo de resultado */
  var cats=[["Birdie o mejor",function(x){return x<=2},"#2f9e5a"],["Par",function(x){return x===3},"#4c8bd6"],["Bogey",function(x){return x===4},"#e0a030"],["Doble o más",function(x){return x>=5},"#d9534f"]];
  var dist=[0,1].map(function(q){
    var segs=cats.map(function(c){var cnt=sc[q].filter(c[1]).length;return cnt?'<span style="flex:'+cnt+';background:'+c[2]+'" title="'+c[0]+'">'+cnt+'</span>':""}).join("");
    return '<div class="dr"><b>'+esc(nm[q])+'</b><div class="bar">'+segs+'</div></div>';
  }).join("");
  var dleg='<div class="lg sm">'+cats.map(function(c){return '<span><i style="background:'+c[2]+'"></i>'+c[0]+'</span>'}).join("")+'</div>';

  /* 4 · estadísticas */
  var w=[0,0,0];
  for(i=0;i<n;i++){if(a[i]<b[i])w[0]++;else if(a[i]>b[i])w[1]++;else w[2]++}
  var tt=[sum(a),sum(b)];
  var mn=function(r){var m=Math.min.apply(null,r);return m+" · hoyo "+(r.indexOf(m)+1)};
  var mxx=function(r){var m=Math.max.apply(null,r);return m+" · hoyo "+(r.indexOf(m)+1)};
  var rows=[["Total",tt[0],tt[1]],["Respecto al par",diff(tt[0]),diff(tt[1])],["Media por hoyo",(tt[0]/n).toFixed(2),(tt[1]/n).toFixed(2)],["Hoyos ganados",w[0],w[1]],["Mejor hoyo",mn(a),mn(b)],["Peor hoyo",mxx(a),mxx(b)]];
  var tbl='<table class="st"><tr><th></th><th>'+esc(nm[0])+'</th><th>'+esc(nm[1])+'</th></tr>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join("")+'</table><div class="lg sm" style="margin-top:6px">Hoyos empatados: '+w[2]+'</div>';

  return '<div class="cg">'+lg+'<div class="ct">Golpes por hoyo</div>'+s1+'<div class="ct">Evolución respecto al par</div>'+s2+'<div class="ct">Tipo de resultado</div>'+dist+dleg+'<div class="ct">Estadísticas de la partida</div>'+tbl+'</div>';
}
function gameCard(g){
  var p=g.players||[];var t=p.map(function(x){return sum(x.scores)});
  var win=t[0]===t[1]?-1:(t[0]<t[1]?0:1);
  var sc=p.map(function(x,i){return '<div class="'+(win===i?"w":"")+'">'+esc(x.name)+(win===i?" 🏆":"")+'<br><b>'+t[i]+'</b> <small>('+diff(t[i])+')</small></div>'}).join("");
  var h="";for(var i=1;i<=HOLES;i++)h+="<th>"+i+"</th>";
  var rows=p.map(function(x){return "<tr><td>"+esc(x.name)+"</td>"+x.scores.map(function(v){return "<td>"+esc(v)+"</td>"}).join("")+"<td><b>"+sum(x.scores)+"</b></td></tr>"}).join("");
  return '<div class="card" data-id="'+esc(g.id)+'"><div class="row"><b>Partida '+esc(g.num||"–")+'</b><small>'+fmtDate(g.date)+'</small></div><small style="color:var(--mut)">'+esc(g.course||"Sin campo")+'</small>'
    +'<div class="score">'+sc+'</div>'
    +'<div class="det hide">'+charts(g)+'<div class="ct">Detalle por hoyo</div><div class="scroll" style="margin-top:0"><table><tr><th>Hoyo</th>'+h+'<th>Total</th></tr>'+rows+'</table></div>'
    +'</div></div>';
}
function render(){
  var list=$("list");
  if(!coll){list.innerHTML='<div class="msg">No se puede acceder a la base de datos compartida. Abre la página desde claude.ai con tu sesión iniciada.</div>';return}
  if(!games.length){list.innerHTML='<div class="msg">Todavía no hay partidas. Añade la primera en «Nueva partida».</div>';return}
  var by={};
  games.forEach(function(g){var k=g.season||"";(by[k]=by[k]||[]).push(g)});
  var ks=Object.keys(by).sort().reverse();
  list.innerHTML=ks.map(function(k){
    return '<h2 class="sh">'+(k?"Temporada "+esc(k):"Sin temporada")+'</h2><div class="stats">'+statsFor(by[k])+'</div>'+by[k].map(gameCard).join("");
  }).join("");
}
$("list").addEventListener("click",function(e){
  var card=e.target.closest(".card");if(!card)return;
  var d=card.querySelector(".det");if(d&&!e.target.closest(".det"))d.classList.toggle("hide");
});
games=(window.PARTIDAS||[]).map(function(g,i){var o=Object.assign({},g);o.id="p"+i;return o})
  .sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||((b.num||0)-(a.num||0))});
render();
})();
</script>
</body>
</html>
